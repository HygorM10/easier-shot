name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          plutil -replace CFBundleShortVersionString -string "$VERSION" Support/Info.plist
          plutil -replace CFBundleVersion -string "${GITHUB_RUN_NUMBER}" Support/Info.plist

      - name: Build disk image
        run: ./make-dmg.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/EasierShot.dmg \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
